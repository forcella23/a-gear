<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My page</title>
  <style>
    img { max-width: 100%; height: auto; }
    .card { margin: 1em 0; }
  </style>
</head>
<body>
  <button onclick="makePage()">Surprise me</button>
  <h2 id="picked"></h2>
  <div id="gallery"></div>

  <script src="data.js"></script>
  <script>
    function makePage() {
      // 1. collect every tag once
      const allTags = [...new Set(items.flatMap(i => i.tags))];
      // 2. shuffle and keep 3
      const picked = allTags.sort(() => Math.random() - 0.5).slice(0, 3);
      // 3. keep items that share at least one picked tag
      const matches = items.filter(i => i.tags.some(t => picked.includes(t)));

      document.getElementById("picked").textContent = picked.join(" / ");
      document.getElementById("gallery").innerHTML = matches.map(i => {
        if (i.type === "image") return '<div class="card"><img src="' + i.content + '"></div>';
        if (i.type === "link")  return '<div class="card"><a href="' + i.content + '" target="_blank">' + i.title + '</a></div>';
        return '<div class="card">' + i.content + '</div>';
      }).join("");
    }
  </script>
</body>
</html>
